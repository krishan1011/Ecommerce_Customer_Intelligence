[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a running PostgreSQL (skipped in CI)",
    "slow: long-running or write-heavy test, opt in explicitly",
]
