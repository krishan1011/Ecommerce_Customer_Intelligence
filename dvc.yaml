stages:
  extract:
    cmd: python -m src.db extract
    deps:
      - params.yaml
      - src/config.py
      - src/db.py
      - src/extract.py
      - sql/03_clean_views.sql
      - sql/04_business_metrics.sql
      - sql/05_modeling_tables.sql
    params:
      - common.analysis_start
      - common.analysis_end
      - common.valid_statuses
      - extraction
    outs:
      - data/processed/orders_enriched.parquet
      - data/processed/customer_orders.parquet
      - data/processed/interactions.parquet
      - data/processed/products_enriched.parquet
      - data/processed/reviews_clean.parquet
      - data/processed/order_geo.parquet
      - data/processed/manifest.json
    always_changed: false

  clean:
    cmd: python -m src.cleaning run
    deps:
      - params.yaml
      - src/config.py
      - src/extract.py
      - src/cleaning.py
      - src/validation.py
      - data/processed/orders_enriched.parquet
      - data/processed/customer_orders.parquet
      - data/processed/interactions.parquet
      - data/processed/products_enriched.parquet
      - data/processed/reviews_clean.parquet
      - data/raw/olist_products_dataset.csv
    params:
      - common.analysis_start
      - common.analysis_end
      - cleaning
      - extraction
      - validation
    outs:
      - data/processed/clean

  validate:
    cmd: python -m src.validation run
    deps:
      - params.yaml
      - src/config.py
      - src/validation.py
      - data/processed/manifest.json
      - data/processed/orders_enriched.parquet
      - data/processed/customer_orders.parquet
      - data/processed/interactions.parquet
      - data/processed/products_enriched.parquet
      - data/processed/reviews_clean.parquet
      - data/processed/order_geo.parquet
      - data/processed/clean
    params:
      - common.analysis_start
      - common.analysis_end
      - validation
    metrics:
      - metrics/validation.json:
          cache: false
    outs:
      - docs/validation_report.md

  features:
    cmd: python -m src.features build
    deps:
      - params.yaml
      - src/config.py
      - src/features.py
      - src/validation.py
      - src/tracking.py
      - data/processed/orders_enriched.parquet
      - data/processed/interactions.parquet
      - data/processed/reviews_clean.parquet
      - data/processed/order_geo.parquet
      - data/processed/products_enriched.parquet
      - data/processed/manifest.json
      - data/processed/clean
    params:
      - common.analysis_end
      - features.horizon_days
      - features.snapshots
      - validation.positive_rate_drift_ratio_limit
    outs:
      - data/processed/features
    metrics:
      - metrics/features.json:
          cache: false

