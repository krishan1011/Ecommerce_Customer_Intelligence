# Single source of truth for tunable constants (fully wired in Phase 7).
# No credentials here.
common:
  random_state: 42
  analysis_start: "2017-01-01"   # confirmed in Phase 1
  analysis_end: "2018-08-31"     # confirmed in Phase 1
  valid_statuses: ["delivered"]  # confirmed in Phase 1

features:
  horizon_days: 90
  snapshots:
    train: ["2017-05-31", "2017-08-31"]
    val: ["2017-12-31"]
    test: ["2018-04-30"]

churn:
  threshold: null                # chosen on validation in Phase 9

monitoring:
  psi_alert: 0.2
  min_batch_size: 200

cleaning:
  winsor_lower: 0.01
  winsor_upper: 0.99
  minimum_valid_item_price: 0

extraction:
  read_chunksize: 50000
  categorical_min_unique: 20
  categorical_max_unique: 1000
  categorical_row_fraction: 0.02

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiments: ["churn", "segments", "clv", "forecast", "delay", "recsys", "nlp", "dl"]

validation:
  soft_null_rate_limit: 0.05
  row_count_tolerance_pct: 5.0
  unusual_category_min_count: 5
  nonnegative_minimum: 0
  minimum_count: 1
  probability_min: 0
  probability_max: 1
  review_score_min: 1
  review_score_max: 5
  positive_rate_drift_ratio_limit: 3.0

dvc:
  remote_name: "storage"

load:
  retry_attempts: 3
  retry_backoff_seconds: 1
